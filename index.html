<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>사이트홈드 3D</title></head>
<body style="margin:0;background:#07110f;color:#d7efe6;font-family:system-ui;padding:16px">
<p id="s">사이트홈드 3D 로딩 중…</p>
<script>
(async () => {
  try {
    const n = 9;
    const parts = [];
    for (let i = 0; i < n; i++) {
      const r = await fetch('part' + i + '.txt');
      if (!r.ok) throw new Error('part' + i + ' ' + r.status);
      parts.push(await r.text());
    }
    const html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.getElementById('s').textContent = '로드 실패: ' + e;
  }
})();
</script>
</body></html>
